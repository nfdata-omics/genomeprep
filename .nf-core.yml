lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-genomeprep_logo_light.png
    - docs/images/nf-core-genomeprep_logo_light.png
    - docs/images/nf-core-genomeprep_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/multiqc_config.yml
  files_unchanged:
    - .github/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-genomeprep_logo_light.png
    - docs/images/nf-core-genomeprep_logo_light.png
    - docs/images/nf-core-genomeprep_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - modules/nf-core/cellrangeratac/mkref/meta.yml
    - modules/nf-core/cellrangeratac/mkref/main.nf
    - assets/nf-core-genomeprep_logo_light.png
  multiqc_config: false
  nextflow_config:
    - manifest.name
    - manifest.homePage
nf_core_version: 3.5.1
repository_type: pipeline
template:
  author: Leandro Tiburske
  description: A pipeline to prepare reference genomes and annotations for non-model
    organisms.
  force: false
  is_nfcore: false
  name: genomeprep
  org: nfdata-omics
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
    - codespaces
  version: 1.0.0dev
